name: Refresh and publish video library
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/New_York

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: video-library-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check playback behavior
        run: node scripts/test-playback.mjs
      - name: Refresh YouTube catalog
        run: node scripts/refresh.mjs
      - name: Save refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/videos.json site/podcasts.json site/status.json data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh channel catalog'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live.mjs
